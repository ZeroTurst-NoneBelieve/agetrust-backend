services:
  postgres:
    image: postgres:15-alpine
    container_name: agetrust-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required. Set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required. Set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required. Set it in .env} -d ${POSTGRES_DB:?POSTGRES_DB is required. Set it in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: agetrust-backend
    # .env의 값을 전부 컨테이너 환경변수로 넘긴다 (#37). 설정을 추가할 때
    # 여기에 이름을 다시 적을 필요가 없다. 이전에는 아래 environment에 하나씩
    # 나열했고, 빠뜨리면 .env에 적어도 조용히 무시되는 사고가 두 번 났다(#24 · #32).
    # 이미지에는 들어가지 않는다. compose가 기동 시점에 주입할 뿐이다.
    env_file: .env
    # environment는 env_file보다 우선한다. 두 경우에만 쓴다.
    environment:
      # 1) 컨테이너 안에서 값이 달라야 하는 것. .env의 DATABASE_URL은 호스트에서
      #    직접 실행할 때 쓰는 localhost 주소이므로 postgres 서비스명으로 덮어쓴다.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required. Set it in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set it in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required. Set it in .env}
      # 2) 비어 있으면 기동을 막아야 하는 시크릿. env_file은 빈 값을 검사하지 않는다.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required. Set it in .env}
      ISSUER_PRIVATE_KEY: ${ISSUER_PRIVATE_KEY:?ISSUER_PRIVATE_KEY is required. Set it in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # Kafka는 healthy까지 기다리지 않는다. Publisher가 브로커 없음을 견디고
      # 재시도하도록 만들었으므로, Kafka가 늦게 떠도 API는 즉시 뜨는 편이 낫다.
      kafka:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: agetrust-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: agetrust-kafka
    depends_on:
      - zookeeper
    # 컨테이너를 다시 만들면 Zookeeper에 직전 broker 등록(ephemeral node)이
    # 아직 남아 있어 "node already exists"로 기동에 실패할 수 있다. 옛 세션은
    # 수십 초 안에 만료되므로, 한 번 죽어도 알아서 다시 뜨게 둔다.
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 리스너를 둘로 나눈다. 컨테이너끼리는 kafka:29092, 호스트(노트북)에서
      # 접속할 때는 localhost:9092 를 쓴다. 하나로 합치면 둘 중 한쪽이 반드시
      # 깨진다 — Kafka는 접속해온 클라이언트에게 "이 주소로 다시 붙어라"라고
      # 알려주는데, 그 주소가 localhost면 backend 컨테이너는 자기 자신을 찾는다.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
