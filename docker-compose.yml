services:
  postgres:
    image: postgres:15-alpine
    container_name: agetrust-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required. Set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required. Set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required. Set it in .env} -d ${POSTGRES_DB:?POSTGRES_DB is required. Set it in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: agetrust-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required. Set it in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set it in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required. Set it in .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required. Set it in .env}
      ISSUER_PRIVATE_KEY: ${ISSUER_PRIVATE_KEY:?ISSUER_PRIVATE_KEY is required. Set it in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: agetrust-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: agetrust-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
